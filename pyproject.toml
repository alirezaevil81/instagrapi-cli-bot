[project]
name = "instagrapi-cli-bot"
version = "0.2.0"
description = "Smart, safe Instagram CLI engagement bot with 2FA support, persistent SQLite queues, Termux device fingerprinting, and rich terminal dashboard - fully aligned with instagrapi 3.0+."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "instagrapi>=3.0.16",
    "questionary>=2.1.0",
    "rich>=14.0.0",
]

[project.scripts]
instabot = "src.main:main"
timeline-bot = "src.services.timeline_liker:main"
followers-bot = "src.services.followers_liker:main"
post-likers-bot = "src.services.post_liker:main"
comments-bot = "src.services.comment_liker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]





